<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            border: 1px solid red;
        }
        ul li {
            border: 1px solid cornflowerblue;
        }
        ul li:nth-child(2){
            background-color: khaki;
            position: absolute;
        }
        /*두 번째 <li> ("123")는 position: absolute;로 설정되어 있어 문서 흐름에서 제거됩니다. 
            따라서 이 항목은 다른 항목들에 영향을 주지 않습니다.
            하지만 top, right, bottom, left 속성이 설정되지 않았기 때문에, 
            두 번째 항목은 부모 요소인 <ul>의 시작점(왼쪽 상단)에서 기본적으로 배치됩니다.*/
        
        
        /*position : 요소의 위치를 제어하는 데 사용 -5가지 속성 static, relative, absolute, fixed, sticky

        absolute: 요소는 가장 가까운 위치가 지정된 조상 요소를 기준으로 배치.
        top, right, bottom, left 속성을 사용하여 정확한 위치를 지정할 수 있습니다.
        */
    </style>
</head>
<body>
    <ul>
        <li>abc</li>
        <li>123</li>
        <li>ㄱㅏㄴㅏㄷㅏ</li>
    </ul>
</body>
</html>
