<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <title>Document</title>
    <style>

    body{
            background-color: white;
        }
       

        .head{
           /* border: 1px solid red; */
            background-color: rgb(233, 233, 233);
            display: flex;
            justify-content: space-between;
            align-items: center; /* 수직 중앙 정렬 */
            height: 400px; /* 헤더 높이에 맞춤 */
            padding: 0 10px; /* 여백 추가 */
            position: relative;
   
        }
        
        .logo {
            flex: 0.5;
            display: flex;
            justify-content: flex-start; /* 왼쪽 정렬 */
            align-items: flex-start; /* 위쪽 정렬 */
            position: absolute; /* 절대 위치 설정 */
            top: 0; /* 상단 맞춤 */
            left: 10px; /* 오른쪽 여백 추가 */
            padding: 10px;
        }
        .logo img {
           
            width: 100px; 
            height: 120px;
            object-fit: cover;
            max-height: 70%; /* 헤더 높이에 맞춤 */
            max-width: 70%; /* 최대 너비를 100%로 설정 */
        }




        .title{
           /* border: 1px solid black; */

            flex: 3;

            display:  flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; /* 수평 중앙 정렬 */
            transition: 0.5s;
        }
        .title img {
            max-height: 80%; /* 부모 div의 80%로 설정 */
    
        }
      




        .user{

          /*  border: 1px solid black; */
            flex: 0.5;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: absolute; /* 절대 위치 설정 */
            top: 0; /* 상단 맞춤 */
            right: 10px; /* 오른쪽 여백 추가 */
            padding: 10px;

        }
        

        .trigger{
            display: none;
            position: absolute;
            right: 0px;
            top: 0px;
        }



        /**/
        section {
            height: calc(100vh - 300px);
            overflow-y: auto; /* 세로 스크롤 가능 */
        }
        .items{
            height: calc(100vh - 300px); /*현재 내 플랫폼. 모바일인지 컴퓨터인지 에 따라 계산하면된다.*/
           
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around; 

        }

        .card a{
            text-decoration: none;
            color: gray;
        }

        .card{
            width: 500px;
           
            border: 1px solid rgb(223, 201, 201);
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;            
        }
        .card img{
            width: 100%;
            
        }

         
 

         /* 모바일 구간 */
         @media (max-width : 768px){

            header{
          /*  border: 1px solid blue; */
            height: auto;
            margin: 0 ;
            }

            .head{
                flex-direction: column;
                align-items: center;
            }
            .logo{
                display: none;
            }
            .title{

                justify-content: center;
                align-items: center; /* 수평 중앙 정렬 */
                width: auto;
            }

            .user{
            display: none; /* 기본적으로 숨김 */
            padding: 10px;
            }
          
            .trigger{
                display: block;
                position: absolute;
                top: 3%;
                right: 3%;
            }
            .user.on{
                display: flex;
            }
            .trigger.on{
                display: none;
            }
        
           
            .card{
                width: 100%;
                text-align: center;
            
            }
            .card img{
                width: 60%;
            }
        }


    </style>

</head>
<body>
    <header>
    <div class="head">
        <div class="logo">   
        <a href="https://www.naver.com">
        <img src="/Front2/복습/69124530.jpg" alt="이미지1">
        </a>
        </div>
        
        <div class="title">
            <h2> Full Stack </h2>
            <img src="/Front2/복습/town.png" alt="이미지2">

        </div>           
        
         <!-- 햄버거 -->
         <div class="trigger" > <img src="/Front2/prac2/images/search.png" alt="이미지3"> </div>

        <div class="user">
            <a href="#"> 로그인 </a>
            <a href="#"  > 회원가입 </a>
        </div>

       
    </div>
    </header>

    <section> 
        <div class="items">
        <div class="card">
            <a href="네이버블로그.html">
            <h2> 짧지만 알차게 7박 8일 자연으로의 여행  </h2>
            <img src="https://img.khan.co.kr/news/2022/06/04/news-p.v1.20220602.c3356a2499a64246bb8a54fbcc2cb697_P1.jpg" alt="">
        </a>
        </div>
        <div class="card">
            <a href="네이버블로그.html">
            <h2> 럭셔리한 4박 5일 쇼핑천국으로의 여행  </h2>
            <img src="https://byline.network/wp-content/uploads/2023/01/trip-01.jpg" alt="">
        </a>
        </div>
        <div class="card">
            <a href="네이버블로그.html">
            <h2> 긴 듯 짧은 15박 17일 유럽 돌아보기 </h2>
            <img src="https://img.khan.co.kr/news/2022/06/04/news-p.v1.20220602.c3356a2499a64246bb8a54fbcc2cb697_P1.jpg" alt="">
        </a>
        </div>
    </div>
    </section>
    <footer> </footer>
    <script>   
        $(".trigger").click(function(){
                $(".user, .trigger").toggleClass('on');
            });

  </script>

    <!-- 위 $  jquery 를 사용하려면 다음 코드 필요! <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>-->

</body>
</html>
