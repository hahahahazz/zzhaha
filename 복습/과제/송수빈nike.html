<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
      header {
        width: 100%;
        height: 60px;
        /* border: 1px solid black; */
        display: flex;
        position: relative;
      }
      .logo {
        width: 100px;
        height: 60px;
        /* border: 1px solid black; */
      }
      .logo img {
        width: 100%;
        height: 100%;
      }
      .menu {
        display: flex;
        justify-content: center;
        flex-grow: 1;
        align-items: center;
      }
      .menu div {
        position: relative;
        cursor: pointer;
        padding:  0 20px;
      }
      .menu div::after {
        content: "";
        display: block;
        height: 2px;
        background: black;
        width: 0;
        transition: width 0.3s ease;
        position: absolute;
        left: 0;
        bottom: -5px;
      }
      .menu div:hover::after {
        width: 100%;
      }
      /* .dropdown {
        width: 100%;
        display: none;
        position: absolute;
        background: rgba(255, 255, 255, 0.9);

        top: 70px;
        left: 0;
      }
      .menu div:hover .dropdown {
        display: block;
      }
      .dropdown div {
        padding: 10px 20px;
        cursor: pointer;
      }
      .dropdown div:hover {
        display: block;
      } */
      .search {
        display: flex;
        align-items: center;
        /* border: 1px solid black; */
        padding: 5px;
        margin-left: 20px;
        position: absolute;
        right: 100px;
        top: 10px;
        border-radius: 50px;
        background-color: rgb(235, 235, 235);
      }
      .search img {
        height: 20px;
        margin-right: 5px;
      }
      .search input {
        border: none;
        outline: none;
        padding: 5px;
        width: 150px;
        background-color: rgb(235, 235, 235);
      }
      header > button {
        height: 50px;
        padding: 5px 15px;
        border: none;
        background-color: rgb(235, 232, 232);
        border-radius: 30px;
        cursor: pointer;
        position: absolute;
        right: 10px;
        top: 5px;
      }
      .banner-ment {
        text-align: center;
        margin-top: 60px;
      }
      .banner-ment > h2 {
        font-size: 40px;
        font-weight: bolder;
        margin: 10px 0;
      }
      .banner-ment > h4 {
        margin: 5px 0;
      }
      .banner-ment button {
        background-color: black;
        color: white;
        border-radius: 30px;
        height: 40px;
        width: 100px;
        font-size: 15px;
        font-weight: bold;
        margin-top: 50px;
        cursor: pointer;
      }
      .trigger {
        display: none;
        width: 25px;
        height: 20px;
        position: absolute;
        right: 10px;
        top: 20px;
        cursor: pointer;
      }
      .trigger span {
        background-color: black;
        height: 1px;
        position: absolute;
        width: 100%;
        transition: 0.3s;
      }
      .trigger span:nth-child(1) {
        top: 0;
      }
      .trigger span:nth-child(2) {
        top: 50%;
      }
      .trigger span:nth-child(3) {
        top: 100%;
      }
      .trigger.active span:nth-child(1) {
        transform: rotate(45deg);
        top: 50%;
      }
      .trigger.active span:nth-child(2) {
        opacity: 0;
      }
      .trigger.active span:nth-child(3) {
        transform: rotate(-45deg);
        top: 50%;
      }

      @media (max-width: 768px) {
        .menu {
          display: none;
        }
        .search {
          display: none;
        }
        .login {
          display: none;
        }
        .trigger {
          display: block;
        }
        .menu.on{
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
        }
        .menu > div{
            margin: 20px 0;

        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="https://mblogthumb-phinf.pstatic.net/20160728_298/ppanppane_1469696985810nqQuL_PNG/%B3%AA%C0%CC%C5%B0_%B7%CE%B0%ED_%281%29.png?type=w800"
          alt=""
        />
      </div>
      <nav class="menu">
        <div>
          New & Featured
          <!-- <div class="dropdown">
            <div>New & Featured</div>
            <div>Collections</div>
            <div>Shop Icons</div>
            <div>Shop by Sports</div>
            <div>Guide</div>
          </div> -->
        </div>
        <div class="">Men</div>
        <div class="">Women</div>
        <div class="">kids</div>
        <div class="">Sale</div>
      </nav>
      <div class="search">
        <img src="https://svgsilh.com/png-1024/1093183.png" alt="" />
        <input type="text" />
      </div>
      <button class="login">login</button>

      <!-- 햄버거 아이콘 -->
      <div class="trigger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>
    <div class="banner">
      <video width="100%" height="600" controls autoplay muted>
        <source src="./images/나이키1.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="banner-ment">
      <h4>나이키 러닝</h4>
      <h2>승리는 쉽게 오지 않는다.</h2>
      <h4>러닝을 싫어해본 적 없다면, 아직 충분히 사랑해본 적이 없는 것.</h4>
      <button>구매하기</button>
    </div>

    <script>
      $(".trigger").click(function () {
        $(".menu").toggleClass("on");
        $(this).toggleClass('active');
      });
    </script>
  </body>
</html>
