<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            padding: 0;
            margin: 0;
        }

        header {
            height: 150px;
            background-color: aquamarine;
        }

        section {
            height: calc(100vh - 300px);
            overflow-y: auto; /* 세로 스크롤 가능 */
        }

        footer {
            height: 150px;
            background-color: blueviolet;
        }

        .item {
            width: 300px;
            height: 300px;
            background-color: red;
            margin: 10px; /* 각 아이템 간격 추가 */
        }
    </style>
</head>
<body>
    
    <header>header</header>
    <section>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </section>
    <footer>footer</footer>
</body>
</html>
