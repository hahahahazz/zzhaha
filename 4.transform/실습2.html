<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            background-color: rgb(69, 122, 48);
            height: 200px;
            
            position: relative;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: chocolate;

            position: absolute;
            top:50px;
            right: 50px;
            
            border: 0.1px solid rgb(224, 206, 206);
        }
        .box>div{
            width: 100%;
            height: 1.2px;
            background-color: black;
            position: absolute;

        }
        .box >div:nth-child(1){
            top: 1%;
        }
        .box >div:nth-child(2){
            top: 50%;
        }
        .box >div:nth-child(3){
            top: 99%;
        }
    </style>
</head>
<body>
    <header>
        <div class="box">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
</body>
</html>
