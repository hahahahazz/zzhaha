<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            display: flex;
        }
        .item{
            border: 1px solid black;
            
            /*모든 애들이 균등으로 넓이를 1 로 가지겠다*/
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="item">a</div>
        <div class="item">b</div>
        <div class="item">c</div>
    </div>
</body>
</html>
