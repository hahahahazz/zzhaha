<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap{
            display: flex;
        }

        /*flex 가지는 넓이의 비율 */
        .item1{
            border: 1px solid black;
            
            flex: 3;

            
        }
        .item2{
            border: 1px solid black;
            
            flex: 1;
            
        }
        .item3{
            border: 1px solid black;
            
            flex: 2;
            
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="item1">a</div>
        <div class="item2">b</div>
        <div class="item3">c</div>
    </div>
</body>
</html>
