<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li{
            background-color: aquamarine;
            border: 1px solid black;
        }
        

        ul li:nth-child(2){
       
            background-color: darkcyan;
            position: absolute;
        }

    </style>
</head>
<body>
    <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
    </ul>
</body>
</html>
