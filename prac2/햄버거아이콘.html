<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            height: 200px;
            background-color: darkolivegreen;
            position: relative;
        }
        .box{
            width: 25px;
            height: 15px;
            background-color: cadetblue;

            position: absolute;
            right: 0px;
            top: 20px;
        }
        .box > div{
            width: 100%;
            height: 1px;
            position: absolute;
    background-color: chartreuse;

        }
.box > div:nth-child(1){

    top: 1%;
}
.box > div:nth-child(2){

    top: 50%;
}
.box > div:nth-child(3){

    top: 99%;
}
    </style>
</head>
<body>
    <header>
        <div class="box">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </header>
</body>
</html>
