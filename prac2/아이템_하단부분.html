            height: 60px;
            border: 1px solid black;

            position: absolute;
            bottom: -60px;
            left: 0px;

            padding: 10px;
            box-sizing: border-box;

            transition: 0.5s;

        }

        .item:hover .desc{
            bottom: 0px;



        }

        .item img{
            width: 100%;
        }
