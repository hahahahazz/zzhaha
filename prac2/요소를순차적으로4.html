<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap > div{
            opacity: 0;
        }


    </style>
</head>
<body>
<div class="wrap">
    <div>김도현</div>
    <div class="item">김무궁</div>
    <div class="item1" >김세중</div>
    <div>김솔</div>
    <div>김정석</div>

</div>

<script>

   divs.forEach(function(item, index){

    setTimeout(function(){

   });
