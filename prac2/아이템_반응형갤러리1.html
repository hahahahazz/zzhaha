<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        body{
            display: flex;
            justify-content: center;
        }
        .wrap{
            width: 950px;
            border: 1px solid black;


        }
        /*상단부분*/
        header{
      
        }
        .gnb{

            text-align: right;
        }
        .search{
            display: flex;
            justify-content: space-between;
        }
        input{
            padding: 5px;
            border: 0px;
            border-bottom: 1px solid black;

            background-image: url(images/search.png);
            background-repeat: no-repeat;
            background-position: right;
            background-size: 20px;

            outline: none;
        }

        .search button{
            border: none;
            font-size: 20px;
            padding: 13px 60px ;
            border-radius: 5px;
            color: wheat;
            background-color: darksalmon;
        }

        .search button:hover{
            background-color: indianred ;
        }


        /* 하단 부분*/
        .items{
            display: flex;
            flex-wrap: wrap;    /*줄 바뀜 */
            justify-content: space-between;
            padding-top: 10px;
        }

        .item{
            width: 300px;
            height: 200px;
            border: 1px solid black;

            overflow: hidden;
            position: relative;

           margin-bottom: 10px;

        }
        .desc{
            width: 100%;
            height: 60px;
            border: 1px solid black;

            position: absolute;
            bottom: -60px;
            left: 0px;

            padding: 10px;
            box-sizing: border-box;

            transition: 0.5s;

        }
        .item:hover .desc{
            bottom: 0px;
        }

        .item img{
            width: 100%;

        }
                 /*모바일 구간*/

        @media (max-width : 768px){
            header{
                width: 100%;
            }
            .gnb{
                text-align:  center;
            }
            .search{
                flex-direction: column;
            }

        }

    </style>
</head>
<body>
    <div class="wrap">
       <!-- 헤더부분 -상단부분 -->
        <header>

            <div class="gnb">
                <a href="#none">Photoshop</a>

            <div class="search">

            </div>

       <!-- 이미지 리스트 - 하단부분 -->
        <div class="items">

                <!-- 호버되는 히든 영역 -->
