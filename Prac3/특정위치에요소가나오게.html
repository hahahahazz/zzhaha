<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            width: 100%;
            height: 200px;
            background-color: antiquewhite;
            position: fixed;
            /* 포지션 releative 가 아니더라도 아래 자식요소는 부모요소로 인식한다*/
        }

        .badge{
            position: absolute;
            right: 10px;
            top: 250px;

            /*처음의 내용을 안보이게 기능중에 
            display : none ;  은 position 이 적용이 안된다. 아래 opacity 사용*/
            opacity: 0;

            transition: 0.5s;
        }


        .content{
            height: 3000px;
            background-color: darkseagreen;
        }


    </style>
</head>
<body>
    <header>
        


        <!-- 아래 내용이 스크롤 되었을때 보이거나 안보이게 -->
        <div class="badge"> 내용 </div>

    </header>
    <div class="content"> </div>
    <script>

        window.addEventListener("scroll", function(){
            console.log("dd");
            console.log(window.scrollY);

            let badge = document.querySelector(".badge");
            if(window.scrollY > 1000){
                badge.style.opacity =1;
            }else{
                badge.style.opacity=0;
            }

        });
    </script>
</body>
</html>
