<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .items {
            width: 900px;
            border: 1px solid black;
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .item{
            width: 290px;
            border: 1px solid black;
         padding: 10px;
        box-sizing: border-box;

        }
        .item img{
            width: 100%;
        }
        .title{
            color: royalblue;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .price{
            display: block;
            color: blue;
            margin-bottom: 10px;
        }
        .badge{
            padding: 5px 10px;
            background-color: pink;
            border-radius: 5px;
        }

        @media (max-width: 767px) {
            .items{
                width: 100%;
            }
            .item{
                width: 100%;
                
            }
        
            .item:nth-child(1){
                order: 3;
            }
            .item:nth-child(2){
                order: 1;
            }
            .item:nth-child(3){
                order: 2;
            }
        }
    </style>
</head>
<body>
    <div class="items">
    <div class="item">
        <img src="/Front2/Prac3/course-01.png" alt="이미지">
        <h4>자바스크립트</h4>
        <span class="title">웹개발</span>
        <span class="price">61000</span>
        <span class="badge">베스트 셀러</span>
    </div>
    <div class="item">
        <img src="/Front2/Prac3/course-02.png" alt="이미지">
        <h4>html</h4>
        <span class="title">웹개발</span>
        <span class="price">51000</span>
        <span class="badge">베스트 셀러</span>
    </div>
    <div class="item">
        <img src="/Front2/Prac3/course-03.png" alt="이미지">
        <h4>스프링</h4>
        <span class="title">웹개발</span>
        <span class="price">71000</span>
        <span class="badge">베스트 셀러</span>
    </div>
</div>
</body>
</html>
