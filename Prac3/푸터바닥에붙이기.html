<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header{
            height: 150px;
            background-color: aquamarine;
        }
        section{
            height: calc(100vh - 300px); /*현재 내 플랫폼. 모바일인지 컴퓨터인지 에 따라 계산하면된다.*/
            background-color: forestgreen;
        }
        footer{
            height: 150px;
            background-color: brown;
        }
    </style>
</head>
<body>
    <header> </header>
    <section> </section>
    <footer> </footer>
</body>
</html>
