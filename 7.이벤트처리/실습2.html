<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        /* 이벤트 처리 함수 , event Handler  이벤트 리스너 = 이벤트 핸들러 */
        function z(){
            alert("hahahahahahahaha");
        }
        
        function a(e){
            alert("aaaaaaa");
            console.log(e);
        }
    </script>
</head>
<body>
    <input type="text" onkeyup="z()">
    <input type="text" onkeyup="a()">
</body>
</html>
